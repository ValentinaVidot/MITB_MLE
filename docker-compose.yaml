services:
  jupyter:
    image: a2_jupyter:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: A2_jupyter_lab
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token= --ServerApp.password= --ServerApp.allow_remote_access=True

  airflow-init:
    image: a2_airflow:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: A2_airflow_init
    hostname: airflow-init
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__FERNET_KEY: PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      PYTHONPATH: /opt/airflow:/opt/airflow/utils
    volumes: &airflow-volumes
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./utils:/opt/airflow/utils
      - ./data:/opt/airflow/data
      - ./datamart:/opt/airflow/datamart
      - ./model_bank:/opt/airflow/model_bank
    entrypoint: >
      /bin/bash -c "airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    image: a2_airflow:latest
    depends_on:
      - airflow-init
    container_name: A2_airflow_webserver
    hostname: airflow-webserver
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: a2_airflow:latest
    depends_on:
      - airflow-init
    container_name: A2_airflow_scheduler
    hostname: airflow-scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler

volumes:
  airflow_data:
